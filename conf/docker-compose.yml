version: "3"
services:
  evanapmdb:
    restart: always
    image: mysql:8.0
    container_name: evanapmdb
    environment:
      - MYSQL_ROOT_PASSWORD=password
    command:
      - bash
      - -c
      - |
        docker-entrypoint.sh mysqld &
        until mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent; do
          sleep 2
        done
        mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "CREATE DATABASE IF NOT EXISTS ordersvc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS skusvc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS usrsvc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        wait
    ports:
      - "3307:3306"

  evanapmredis:
    restart: always
    image: redis:latest
    container_name: evanapmredis
    ports:
      - "6380:6379"
  jaeger:
    image: jaegertracing/all-in-one:1.52
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 4317:4317
      - 4318:4318
      - 9411:9411
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 54317:4317 # OTLP gRPC receiver
      - 54318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
  ordersvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ordersvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=ordersvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/ordersvc
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - SKU_GRPC_ADDR=skusvc:8001
      - USER_GRPC_ADDR=usrsvc:8002
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - ENABLE_FILEBEAT=true
    depends_on:
      - evanapmdb
      - otel-collector
      - skusvc
      - usrsvc
      - elasticsearch
    ports:
      - 8080:8080
    volumes:
      - "./logs:/logs"
      - "./logcollect/ordersvc.yml:/logcollect/ordersvc.yml"
      - ordersvc-filebeat-data:/var/lib/filebeat

  skusvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: skusvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=skusvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/skusvc
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - ENABLE_FILEBEAT=true
    depends_on:
      - evanapmdb
      - otel-collector
      - elasticsearch
    ports:
      - 8091:8091
      - 8001:8001
    volumes:
      - "./logs:/logs"
      - "./logcollect/skusvc.yml:/logcollect/skusvc.yml"
      - skusvc-filebeat-data:/var/lib/filebeat

  usrsvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: usrsvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=usrsvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/usrsvc
      - REDIS_ADDR=evanapmredis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - ENABLE_FILEBEAT=true
    depends_on:
      - evanapmdb
      - evanapmredis
      - otel-collector
      - elasticsearch
    ports:
      - 8092:8092
      - 8002:8002
    volumes:
      - "./logs:/logs"
      - "./logcollect/usrsvc.yml:/logcollect/usrsvc.yml"
      - usrsvc-filebeat-data:/var/lib/filebeat

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=123456
    ports:
      - 3000:3000
    container_name: "grafana0"
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    container_name: "prometheus0"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.2
    container_name: elasticsearch2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.14.2
    container_name: kibana2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.14.2
    container_name: logstash2
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    ports:
      - "5044:5044"
    mem_reservation: 1024M
    cpu_count: 1

volumes:
  ordersvc-filebeat-data:
  skusvc-filebeat-data:
  usrsvc-filebeat-data:
