version: "3"
services:
  evanapmdb:
    restart: always
    image: mysql:8.0
    container_name: evanapmdb
    environment:
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3307:3306"

  evanapmredis:
    restart: always
    image: redis:latest
    container_name: evanapmredis
    ports:
      - "6380:6379"
  jaeger:
    image: jaegertracing/all-in-one:1.52
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 4317:4317
      - 4318:4318
      - 9411:9411
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 54317:4317 # OTLP gRPC receiver
      - 54318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
  ordersvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ordersvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=ordersvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/ordersvc
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - SKU_GRPC_ADDR=skusvc:8001
      - USER_GRPC_ADDR=usrsvc:8002
    depends_on:
      - evanapmdb
      - otel-collector
      - skusvc
      - usrsvc
    ports:
      - 8080:8080

  skusvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: skusvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=skusvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/skusvc
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      - evanapmdb
      - otel-collector
    ports:
      - 8091:8091
      - 8001:8001

  usrsvc:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: usrsvc
    restart: always
    environment:
      - OTEL_SERVICE_NAME=usrsvc
      - DB_DSN=root:password@tcp(evanapmdb:3306)/usrsvc
      - REDIS_ADDR=evanapmredis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    depends_on:
      - evanapmdb
      - evanapmredis
      - otel-collector
    ports:
      - 8092:8092
      - 8002:8002
  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - 3000:3000
    container_name: "grafana0"
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    container_name: "prometheus0"
