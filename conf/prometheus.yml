global:
  scrape_interval: 15s #默认抓取周期
scrape_configs:
  - job_name: "ordersvc"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "skusvc"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8091"]

  - job_name: "usrsvc"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8092"]
